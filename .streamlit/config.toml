# The "Industry" palette the Phase 7 design reference is built in: a light
# technical ground, one steel accent, square corners. The rest of the look is
# injected by ui/theme.py, which Streamlit's theme options cannot express.
[theme]
base = "light"
primaryColor = "#5980a6"
backgroundColor = "#f2f2f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1f20"

[client]
# Streamlit's toolbar defaults to "auto", which on a local run means developer
# mode: the hamburger dev menu, a "Deploy" button, and the single-key hotkeys
# behind them. One of those hotkeys is `c` — "clear caches" — and it fires on
# **Ctrl+C**, so a judge copying a run id out of the trace timeline gets a
# modal dialog instead. "viewer" removes all three.
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
